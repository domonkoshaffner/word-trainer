    const item = state.batchItems[idx];
    const prompt = state.direction==='DE2EN' ? item.de : item.en;
    const answer = state.direction==='DE2EN' ? item.en : item.de;
    
    // Callback when user answers
    const onAnswer = async (correct) => {
      state.score.total++;
      if (correct) {
        state.score.correct++;
        // Increment mistake counter if in normal mode (not practice mistakes batch)
        if (!state.isPracticeMistakesBatch && !state.testMode.active) {
          try {
            await fetch('/api/mistakes/increment', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ sheet: state.sheet, de: item.de, en: item.en })
            });
          } catch (e) {
            console.error('Failed to increment mistake counter:', e);
          }
        }
      } else {
        state.mistakes.add(idx);
        // Add to mistakes tracking
        if (!state.testMode.active) {
          try {
            await fetch('/api/mistakes/add', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ sheet: state.sheet, de: item.de, en: item.en })
            });

            console.error('Failed to add mistake:', e);

      // Track test stats

        const weight = state.testMode.stats.byType.mcq.weight;

        state.testMode.stats.maxWeightedScore += weight;
        if (correct) {

    ExerciseTypes.wordMatching.render(null, null, null, null);
  }

  function renderSentenceOrdering(){
    if (!state.testMode.active) state.stage = 'sentenceorder';
    const idx = state.qOrder[state.qIdx];
    const item = state.batchItems[idx];
    const sentence = (item.hint || '').trim();

    // If no sentence available, skip gracefully
    if (!sentence || sentence.split(/\s+/).length < 3) {
      state.mistakes.add(idx);
      progressExercise();
      return;
    }

    const words = sentence.split(/\s+/);
    
    // Check total word count first to decide chunking strategy
    let chunks;
    if (words.length >= 7) {
      // Split into 2-word chunks, preserving commas
      chunks = [];
      for (let i = 0; i < words.length; i += 2) {
        const chunk = words.slice(i, i + 2).join(' ');
        chunks.push(chunk);
      }
    } else {
      // Keep individual words for shorter sentences
      chunks = words;
    }
    
    const shuffled = shuffle(chunks.slice());

    const questionCounter = state.testMode.active 
      ? `Q ${state.testMode.currentExerciseIdx + 1} / ${state.testMode.exercises.length}`
      : `Q ${state.qIdx+1} / ${state.qOrder.length}`;

    const targetId = 'sentenceTarget';
    const bankId = 'tokenBank';

    $('#stage').innerHTML = `
      <div class="title">
        <span>Unscramble</span>
        <span class="muted">${questionCounter}</span>
      </div>

      <div class="prompt" style="margin-bottom: 12px;">${colorArticles(item.de)}</div>

      <div id="${targetId}" style="display:flex; flex-wrap:wrap; gap:10px; padding:16px; min-height:64px; background: var(--btn); border: 2px dashed var(--border); border-radius: 12px;"></div>

      <div style="text-align:center; margin: 8px 0; color: var(--muted); font-size: 12px;">Tap words to arrange them. Tap placed words to remove them.</div>

      <div id="${bankId}" style="display:flex; flex-wrap:wrap; gap:10px; padding:14px; background: linear-gradient(135deg, rgba(0, 255, 65,0.12), rgba(0, 255, 65,0.04)); border: 1px solid var(--border); border-radius: 12px;"></div>

      <div id="orderFeedback" style="margin-top:12px;"></div>

      <div class="controls" style="margin-top: 16px; display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
        <button id="submitBtn" disabled>Submit</button>
        <button id="resetBtn" style="background: var(--btn); color: var(--fg); border: 2px solid var(--border);">Reset</button>
      </div>
    `;

    const targetEl = $('#'+targetId);
    const bankEl = $('#'+bankId);
    const feedbackEl = $('#orderFeedback');
    const submitBtn = $('#submitBtn');
    const resetBtn = $('#resetBtn');

    const makeChip = (text, isBank, isUsed = false) => {
      const btn = document.createElement('button');
      btn.className = 'word-chip';
      btn.textContent = text;
      btn.dataset.text = text;
      btn.dataset.isBank = isBank;
      btn.dataset.isUsed = isUsed;
      
      if (isBank) {
        btn.style.cssText = `padding:10px 14px; border-radius:999px; border:1px solid var(--border); background:var(--app-bg); box-shadow:0 2px 6px rgba(0,0,0,0.06); transition:all 0.2s ease; cursor:pointer; ${isUsed ? 'opacity:0.4; filter:grayscale(100%); cursor:not-allowed;' : ''}`;
        btn.onclick = () => {
          // Check if this specific chip is already used
          if (btn.dataset.isUsed === 'true') return;
          
          const placed = makeChip(text, false);
          targetEl.appendChild(placed);
          btn.dataset.isUsed = 'true';
          btn.style.opacity = '0.4';
          btn.style.filter = 'grayscale(100%)';
          btn.style.cursor = 'not-allowed';
          updateState();
        };
      } else {
        btn.style.cssText = 'padding:10px 14px; border-radius:999px; border:1px solid var(--border); background:var(--app-bg); box-shadow:0 2px 6px rgba(0,0,0,0.06); transition:all 0.2s ease; cursor:pointer;';
        btn.onclick = () => {
          // Find the corresponding bank chip and restore it
          const bankChip = bankEl.querySelector(`[data-text="${text}"][data-is-bank="true"]`);
          if (bankChip) {
            bankChip.dataset.isUsed = 'false';
            bankChip.style.opacity = '1';
            bankChip.style.filter = 'none';
            bankChip.style.cursor = 'pointer';
          }
          btn.remove();
          updateState();
        };
      }
      return btn;
    };

    shuffled.forEach(chunk => bankEl.appendChild(makeChip(chunk, true)));

    function getCurrentAnswer() {
      return Array.from(targetEl.querySelectorAll('.word-chip')).map(x => x.textContent).join(' ');
    }

    function updateState() {
      const placedCount = targetEl.querySelectorAll('.word-chip').length;
      submitBtn.disabled = placedCount !== chunks.length;
      feedbackEl.innerHTML = '';
    }

    resetBtn.onclick = () => {
      // Remove all placed chips
      Array.from(targetEl.querySelectorAll('.word-chip')).forEach(ch => {
        ch.remove();
      });
      // Reset all bank chips to unused state
      Array.from(bankEl.querySelectorAll('.word-chip')).forEach(chip => {
        chip.dataset.isUsed = 'false';
        chip.style.opacity = '1';
        chip.style.filter = 'none';
        chip.style.cursor = 'pointer';
      });
      updateState();
    };

    submitBtn.onclick = () => {
      const userSentence = getCurrentAnswer();
      const correct = userSentence === chunks.join(' ');
      feedbackEl.innerHTML = correct
        ? `<div class="hint-box" style="margin-top: 8px; background: linear-gradient(135deg, rgba(0, 255, 65, 0.12), rgba(0, 255, 65, 0.08)); border-left-color: #00ff41;"><div class="hint-icon" style="font-size: 24px; color: #00ff41;">✓</div><div class="hint-content"><span class="hint-label" style="color:#00b300;">Correct!</span><div style="margin-top:4px; font-weight:600;">${sentence}</div></div></div>`
        : `<div class="hint-box" style="margin-top: 8px; background: linear-gradient(135deg, rgba(255, 46, 58, 0.12), rgba(255, 46, 58, 0.08)); border-left-color: #ff2e3a;"><div class="hint-icon" style="font-size: 24px; color: #ff2e3a;">✗</div><div class="hint-content"><span class="hint-label" style="color:#e63946;">Incorrect!</span><div style="margin-top:4px; font-weight:600;">${sentence}</div></div></div>`;

      // Call standard answer handler for scoring/mistakes
      // (We reuse the multiple choice/typing patterns)
      (async () => {
        // mimic onAnswer from other wrappers
        state.score.total++;
        if (correct) {
          state.score.correct++;
          if (!state.isPracticeMistakesBatch && !state.testMode.active) {
            try {
              await fetch('/api/mistakes/increment', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sheet: state.sheet, de: item.de, en: item.en })
              });
            } catch (e) { console.error('Failed to increment mistake counter:', e); }
          }
        } else {
          state.mistakes.add(idx);
          if (!state.testMode.active) {
            try {
              await fetch('/api/mistakes/add', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sheet: state.sheet, de: item.de, en: item.en })
              });
            } catch (e) { console.error('Failed to add mistake:', e); }
          }
        }
      })();

      // Replace controls with Next button
      const controls = feedbackEl.nextElementSibling;
      controls.innerHTML = `<button id="nextBtn">Next</button>`;
      $('#nextBtn').onclick = () => {
        progressExercise();
      };
    };

    updateState();
  }

  function renderPracticePrompt(mistakes){
    $('#stage').innerHTML = `
      <div class="title">Batch Complete</div>
      <div class="prompt">You missed ${mistakes.length} word${mistakes.length>1?'s':''}. Practice them now?</div>
      <div class="controls"><button id="practiceBtn">Practice Mistakes</button><button id="skipBtn">Skip</button></div>`;
    $('#practiceBtn').onclick = () => { 
      state.qIdx = 0; 
      state.practiceIndices = shuffle(mistakes);
      renderTyping(true, state.practiceIndices); 
    };
    $('#skipBtn').onclick = afterBatch;
  }

  async function afterBatch(){
    // If test mode, show test results
    if (state.testMode.active) {
      const totalTime = state.testMode.stats.endTime - state.testMode.stats.startTime;

      const seconds = Math.floor((totalTime % 60000) / 1000);
      const timeDisplay = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      // Calculate weighted percentage
      const weightedScore = state.testMode.stats.weightedScore;
      const maxWeightedScore = state.testMode.stats.maxWeightedScore;
      const percentage = maxWeightedScore > 0 ? Math.round((weightedScore / maxWeightedScore) * 100) : 0;
      const mistakesList = [...state.mistakes].map(idx => state.batchItems[idx]);
      
      // Performance color

            <div style="font-size: 32px; font-weight: 700; color: var(--accent);">${weightedScore.toFixed(1)} / ${maxWeightedScore.toFixed(1)}</div>
            <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;">Weighted Score</div>
          </div>
          <div style="background: linear-gradient(135deg, ${performanceColor}15, ${performanceColor}05); border: 2px solid ${performanceColor}; border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s ease;">
            <div style="font-size: 32px; font-weight: 700; color: ${performanceColor};">${percentage}%</div>
            <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;">Score</div>
          </div>
          <div style="background: linear-gradient(135deg, rgba(0, 204, 68,0.15), rgba(0, 204, 68,0.05)); border: 2px solid #00cc44; border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s ease;">
            <div style="font-size: 32px; font-weight: 700; color: #00cc44;">${timeDisplay}</div>
            <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;">Time</div>
          </div>
        </div>
        
        <div style="margin-top: 24px;">

        </div>
        
        ${mistakesHTML}
        
        <div class="controls" style="margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <button id="retakeBtn" style="background: var(--btn); color: var(--fg); border: 2px solid var(--border); transition: all 0.3s ease;">Retake Test</button>
          <button id="menuBtn" style="background: linear-gradient(135deg, var(--accent), #00b347); color: #001a06; border: none; font-weight: 600; transition: all 0.3s ease;">Main Menu</button>

      // Retake test button

        renderIntro();
      };
      
      state.score = {correct:0,total:0}; 
      updateHeader();
      return;
    }
    
    // If practice mistakes batch, just return to intro without incrementing
    if (state.isPracticeMistakesBatch) {
      state.isPracticeMistakesBatch = false;
      state.qIdx = 0; state.qOrder = []; state.mistakes.clear();
      state.score = {correct:0,total:0};
      $('#stage').innerHTML = `

      const correctWords = state.batchItems
        .map((word, idx) => ({ word, idx }))
        .filter(({ idx }) => !state.mistakes.has(idx))

    const batchCompleteTitle = state.batchIndex >= state.totalBatches

      : `Batch ${state.batchIndex} Complete`;
    
    if (state.batchIndex >= state.totalBatches) {
      // Completed beyond last batch - just show results and main menu
      $('#stage').innerHTML = `
        <div class="results-screen">
        <div style="text-align: center; margin-bottom: 24px;">
          <div class="title" style="font-size: 28px; margin-bottom: 8px;">${batchCompleteTitle}</div>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin: 24px 0;">
          <div style="background: linear-gradient(135deg, rgba(0, 255, 65,0.15), rgba(0, 255, 65,0.05)); border: 2px solid var(--accent); border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s ease;">
            <div style="font-size: 32px; font-weight: 700; color: var(--accent);">${finalScore.correct}/${finalScore.total}</div>
            <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;">Correct</div>
          </div>
          <div style="background: linear-gradient(135deg, ${performanceColor}15, ${performanceColor}05); border: 2px solid ${performanceColor}; border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s ease;">
            <div style="font-size: 32px; font-weight: 700; color: ${performanceColor};">${percentage}%</div>
            <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;">Score</div>
          </div>
          <div style="background: linear-gradient(135deg, rgba(255, 46, 58,0.15), rgba(255, 46, 58,0.05)); border: 2px solid var(--bad); border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s ease;">
            <div style="font-size: 32px; font-weight: 700; color: var(--bad);">${mistakesList.length}</div>
            <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;">Mistakes</div>
          </div>
        </div>
        
        ${mistakesHTML}
        
        <div class="controls" style="margin-top: 32px;">
          <button id="menuBtn" style="background: linear-gradient(135deg, var(--accent), #00b347); color: #001a06; border: none; font-weight: 600;">Back to Batches</button>
        </div>
        </div>`;
      $('#menuBtn').onclick = renderIntro;
    } else {
      $('#stage').innerHTML = `
        <div class="results-screen">
        <div style="text-align: center; margin-bottom: 24px;">
          <div class="title" style="font-size: 28px; margin-bottom: 8px;">Batch ${state.batchIndex} Complete</div>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin: 24px 0;">
          <div style="background: linear-gradient(135deg, rgba(0, 255, 65,0.15), rgba(0, 255, 65,0.05)); border: 2px solid var(--accent); border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s ease;">
            <div style="font-size: 32px; font-weight: 700; color: var(--accent);">${finalScore.correct}/${finalScore.total}</div>
            <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;">Correct</div>
          </div>
          <div style="background: linear-gradient(135deg, ${performanceColor}15, ${performanceColor}05); border: 2px solid ${performanceColor}; border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s ease;">
            <div style="font-size: 32px; font-weight: 700; color: ${performanceColor};">${percentage}%</div>
            <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;">Score</div>
          </div>
          <div style="background: linear-gradient(135deg, rgba(255, 46, 58,0.15), rgba(255, 46, 58,0.05)); border: 2px solid var(--bad); border-radius: 16px; padding: 20px; text-align: center; transition: all 0.3s ease;">
            <div style="font-size: 32px; font-weight: 700; color: var(--bad);">${mistakesList.length}</div>
            <div style="font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px;">Mistakes</div>
          </div>
        </div>
        
        ${mistakesHTML}
        
        <div class="controls" style="margin-top: 32px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
          <button id="practiceAgainBtn" style="background: var(--btn); color: var(--fg); border: 2px solid var(--border); transition: all 0.3s ease;">Practice Again</button>
          <button id="nextBtn" style="background: linear-gradient(135deg, var(--accent), #00b347); color: #001a06; border: none; font-weight: 600; transition: all 0.3s ease;">Next Batch</button>
          <button id="menuBtn" style="background: var(--btn); color: var(--fg); border: 2px solid var(--border); transition: all 0.3s ease;">Main Menu</button>
        </div>
        </div>`;
      
      // Practice Again button - restart current batch with same exercise type
      $('#practiceAgainBtn').onclick = () => {
        state.batchIndex = state.batchIndex - 1; // Go back to current batch
        localStorage.setItem('batchIndex', state.batchIndex);
        const start = state.batchIndex * state.batchSize;
        const end = Math.min(start + state.batchSize, state.pairs.length);
        state.batchItems = state.pairs.slice(start, end);
        state.isPracticeMistakesBatch = false;
        
        // Start the same exercise mode
        if (state.exerciseMode === 'mcq-only') {
          startMCQOnly();
        } else if (state.exerciseMode === 'typing-only') {
          startTypingOnly();
        } else if (state.exerciseMode === 'truefalse-only') {
          startTrueFalseOnly();
        } else if (state.exerciseMode === 'matching-only') {
          startWordMatchingOnly();
        } else if (state.exerciseMode === 'sentence-order-only') {
          startSentenceOrderingOnly();
        } else {
          // Default to full practice mode
          startBatch(false);
        }
      };
      
      // Next Batch button
      $('#nextBtn').onclick = () => {
        // Load the next batch items and start the same exercise type
        const start = state.batchIndex * state.batchSize;
        const end = Math.min(start + state.batchSize, state.pairs.length);
        state.batchItems = state.pairs.slice(start, end);
        state.isPracticeMistakesBatch = false;
        localStorage.setItem('batchIndex', state.batchIndex);
        
        // Start the same exercise mode
        if (state.exerciseMode === 'mcq-only') {
          startMCQOnly();
        } else if (state.exerciseMode === 'typing-only') {
          startTypingOnly();
        } else if (state.exerciseMode === 'truefalse-only') {
          startTrueFalseOnly();
        } else if (state.exerciseMode === 'matching-only') {
          startWordMatchingOnly();
        } else if (state.exerciseMode === 'sentence-order-only') {
          startSentenceOrderingOnly();
        } else {
          // Default to full practice mode
          startBatch(false);
        }
      };
      
      // Main Menu button
      $('#menuBtn').onclick = renderIntro;
    }
    state.score = {correct:0,total:0}; updateHeader();
  }

  // Restart button - goes back to exercise selection
  $('#restartBtn').onclick = () => { 
    renderExerciseSelection();
  };

  // Brand click to go back to home (batch selection)
  $('.brand').onclick = () => {
    if (state.sheet && state.stage !== 'intro') {
      renderIntro();
    }
  };

  // Boot
  loadSheets().catch(err => {
    $('#stage').innerHTML = `<div class="title">Error</div><div class="prompt">${String(err.message||err)}</div>`;
  });
})();
</script>
</body>
</html>

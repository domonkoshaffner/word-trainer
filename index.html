<script>
(() => {
  // The falling code is the signature of this theme, so it runs regardless of
  // prefers-reduced-motion (the only motion that's suppressed is the CRT flicker).
  const canvas = document.getElementById('matrixRain');
  if (!canvas) return;
  const ctx = canvas.getContext('2d', { alpha: true });

  // Glyph set: katakana + a few latin/numerals — the classic "falling code" look.
  const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789:.=*+-<>'.split('');
  const FONT_SIZE = 16;
  let cols = 0, drops = [], dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(window.innerWidth / FONT_SIZE);
    drops = new Array(cols).fill(0).map(() => Math.floor(Math.random() * -50));
  }

  let last = 0;
  const STEP = 55; // ms between frames — keeps the cascade readable, not frantic
  function draw(now) {
    requestAnimationFrame(draw);
    if (now - last < STEP) return;
    last = now;

    // Fade the previous frame to leave glowing trails (lower alpha = longer tails)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.font = FONT_SIZE + "px 'Share Tech Mono', monospace";
    for (let i = 0; i < cols; i++) {
      const ch = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      const x = i * FONT_SIZE;
      const y = drops[i] * FONT_SIZE;

      // Bright leading glyph, dimmer green tail
      if (Math.random() > 0.975) {
        ctx.fillStyle = '#d6ffe2';
        ctx.shadowColor = '#00ff41';
        ctx.shadowBlur = 12;
      } else {
        ctx.fillStyle = '#00ff41';
        ctx.shadowColor = '#00ff41';
        ctx.shadowBlur = 6;
      }
      ctx.fillText(ch, x, y);
      ctx.shadowBlur = 0;

      if (y > window.innerHeight && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(draw);
})();
</script>

<script>
(() => {
  // --- State ---
  const $ = (sel) => document.querySelector(sel);
  const state = {
    sheets: [],
    sheet: null,
    pairs: [],
    batchSize: parseInt(localStorage.getItem('batchSize')) || 10,
    batchIndex: 0,
    totalBatches: 0,
    direction: localStorage.getItem('direction') || 'DE2EN',
    theme: localStorage.getItem('theme') || 'dark',
    stage: 'idle',
    qOrder: [],
    qIdx: 0,
    score: { correct: 0, total: 0 },
    mistakes: new Set(),  // indices within the current batch
    batchItems: [],
    practiceIndices: [],  // indices for practice mode
    exerciseMode: 'full',  // 'full', 'mcq-only', or 'typing-only'
    blitzMode: false,  // Blitz mode enabled/disabled
    blitzViewTime: 1,  // Seconds to view the question
    blitzAnswerTime: 3,  // Seconds to answer
    blitzTimer: null,  // Timer reference
    isPracticeMistakesBatch: false,  // Whether current batch is practice mistakes
    testMode: {
      active: false,
      exercises: [],  // Array of {type, wordIndices}
      currentExerciseIdx: 0,
      size: null,  // 'short', 'medium', 'long'
      difficulty: null,  // 'easy', 'medium', 'hard'
      stats: {
        byType: {
          mcq: {correct: 0, total: 0, weight: 1},
          typing: {correct: 0, total: 0, weight: 2},
          truefalse: {correct: 0, total: 0, weight: 0.5},
          matching: {correct: 0, total: 0, weight: 1}
        },
        startTime: null,
        endTime: null,
        weightedScore: 0,
        maxWeightedScore: 0
      },
      timerInterval: null
    }
  };

  // --- Utilities ---
  const shuffle = (arr) => { for (let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]} return arr; };
  const normalize = s => String(s||'').trim();
  const equals = (a,b) => {
    // Strict 1-to-1 match: user answer must exactly match the correct answer
    // Only case-insensitive, everything else must be exact
    const userAnswer = normalize(a).toLowerCase();
    const correctAnswer = normalize(b).toLowerCase();
    return userAnswer === correctAnswer;
  };
  
  // Color-code German articles for better memorization
  const colorArticles = (text) => {
    return String(text)
      .replace(/\b(der)\b/gi, '<span class="article-der">$1</span>')
      .replace(/\b(die)\b/gi, '<span class="article-die">$1</span>')
      .replace(/\b(das)\b/gi, '<span class="article-das">$1</span>');
  };
  
  // Confirmation Modal
  const showConfirmModal = (icon, title, message, onConfirm) => {
    const modalHTML = `
      <div class="modal-overlay" id="confirmModal">
        <div class="modal-content">
          <div class="modal-icon">${icon}</div>
          <div class="modal-title">${title}</div>
          <div class="modal-message">${message}</div>
          <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" id="modalCancel">Cancel</button>
            <button class="modal-btn modal-btn-confirm" id="modalConfirm">Confirm</button>
          </div>
        </div>
      </div>
    `;
    
    // Add modal to body
    document.body.insertAdjacentHTML('beforeend', modalHTML);
    
    const modal = $('#confirmModal');
    const cancelBtn = $('#modalCancel');
    const confirmBtn = $('#modalConfirm');
    
    const closeModal = () => {
      modal.remove();
    };
    
    // Close on overlay click
    modal.onclick = (e) => {
      if (e.target === modal) closeModal();
    };
    
    // Cancel button
    cancelBtn.onclick = closeModal;
    
    // Confirm button
    confirmBtn.onclick = () => {
      closeModal();
      onConfirm();
    };
    
    // ESC key to close
    const handleEsc = (e) => {
      if (e.key === 'Escape') {
        closeModal();
        document.removeEventListener('keydown', handleEsc);
      }
    };
    document.addEventListener('keydown', handleEsc);
  };

  // =============================================================================
  // EXERCISE MODULES - Modular, reusable exercise types
  // =============================================================================
  // Each exercise module follows this interface:
  // - render(item, answer, prompt, onAnswer): Display the exercise
  // - cleanup(): Remove event listeners and clean up resources
  // 
  // Adding a new exercise type is easy! Just add a new module here:
  //
  // ExerciseTypes.yourNewType = {
  //   listeners: [],
  //   render(item, answer, prompt, onAnswer) {
  //     // Your exercise UI and logic here
  //     // Call onAnswer(correct) when user answers
  //     // Call this.cleanup() then progressExercise() to move to next question
  //   },
  //   cleanup() {
  //     // Clean up event listeners
  //     this.listeners.forEach(({element, event, handler}) => {
  //       if (event) element.removeEventListener(event, handler);
  //     });
  //     this.listeners = [];
  //   }
  // };
  //
  // Then create a render wrapper function like renderMCQ() and renderTyping()
  // =============================================================================

  const ExerciseTypes = {
    // ===== TRUE OR FALSE EXERCISE =====
    trueFalse: {
      listeners: [],
      
      render(item, answer, prompt, onAnswer) {
        // Randomly decide if we show correct or incorrect translation
        const showCorrect = Math.random() > 0.5;
        let displayedTranslation;
        let displayedItem = item; // Track which item we're displaying
        
        if (showCorrect) {
          displayedTranslation = answer;
        } else {
          // Get a random wrong answer from the batch
          const pool = state.batchItems.map(x => state.direction==='DE2EN' ? x.en : x.de);
          const wrongs = pool.filter(x => !equals(x, answer));
          displayedTranslation = wrongs.length > 0 ? wrongs[Math.floor(Math.random() * wrongs.length)] : answer;
          
          // Find the item that matches the displayed translation to show its hint
          const matchedItem = state.batchItems.find(x => {
            const trans = state.direction==='DE2EN' ? x.en : x.de;
            return equals(trans, displayedTranslation);
          });
          if (matchedItem) displayedItem = matchedItem;
        }
        
        const correctAnswer = equals(displayedTranslation, answer);
        
        const questionCounter = state.testMode.active 
          ? `Q ${state.testMode.currentExerciseIdx + 1} / ${state.testMode.exercises.length}`
          : `Q ${state.qIdx+1} / ${state.batchItems.length}`;
        
        // Generate hint HTML if hint exists
        const hintHTML = displayedItem.hint ? `
          <div class="hint-box">
            <div class="hint-icon">💡</div>
            <div class="hint-content">
              <span class="hint-label">Example:</span>${displayedItem.hint}
            </div>
          </div>
        ` : '';
        
        $('#stage').innerHTML = `
          <div class="title">
            <span>True or False</span>
            <span class="muted">${questionCounter}</span>
          </div>
          <div class="prompt" aria-live="polite">${colorArticles(prompt)}</div>
          <div style="font-size: 24px; font-weight: 600; margin: 24px 0; padding: 20px; background: var(--btn); border: 2px solid var(--border); border-radius: 16px; text-align: center;">
            ${colorArticles(displayedTranslation)}
          </div>
          ${hintHTML}
          <div class="options">
            <button class="opt" data-answer="true" style="font-size: 18px;">✓ True</button>
            <button class="opt" data-answer="false" style="font-size: 18px;">✗ False</button>
          </div>
          <div id="correctAnswerFeedback"></div>
          <div class="controls">
            <button id="nextBtn" disabled>Next</button>
          </div>`;
        
        updateHeader();
        
        let locked = false;
        const optButtons = [...document.querySelectorAll('.opt')];
        const promptEl = $('.prompt');
        
        // Blitz mode: Start timer
        if (state.blitzMode) {
          startBlitzTimer(
            // onBlur callback
            () => {
              if (promptEl) promptEl.classList.add('blurred');
            },
            // onTimeout callback
            () => {
              if (!locked) {
                // Time's up - mark as incorrect
                locked = true;
                onAnswer(false);
                state.mistakes.add(state.qOrder[state.qIdx]);
                
                // Unblur the prompt so user can see the original question
                if (promptEl) promptEl.classList.remove('blurred');
                
                // Show correct answer
                optButtons.forEach(b => {
                  const userSaidTrue = b.dataset.answer === 'true';
                  if (userSaidTrue === correctAnswer) {
                    b.classList.add('correct');
                  }
                  b.disabled = true;
                });
                
                // Enable Next button
                $('#nextBtn').disabled = false;
                updateHeader();
              }
            }
          );
        }
        
        const handleOptionClick = (btn) => () => {
          if (locked) return;
          locked = true;
          
          // Stop blitz timer
          if (state.blitzMode) {
            stopBlitzTimer();
          }
          
          const userSaidTrue = btn.dataset.answer === 'true';
          const userIsCorrect = userSaidTrue === correctAnswer;
          
          btn.classList.add(userIsCorrect ? 'correct' : 'wrong');
          
          // If incorrect, or if the correct answer was "False", show the correct answer feedback
          if (!userIsCorrect || !userSaidTrue) {
            if (promptEl) promptEl.classList.remove('blurred');
            
            const feedbackEl = $('#correctAnswerFeedback');
            if (feedbackEl) {
              feedbackEl.innerHTML = `
                <div class="hint-box" style="margin-top: 16px; background: linear-gradient(135deg, rgba(0, 255, 65, 0.12), rgba(0, 255, 65, 0.08)); border-left-color: #00ff41;">
                  <div class="hint-icon" style="font-size: 24px; color: #00ff41;">✓</div>
                  <div class="hint-content">
                    <span class="hint-label" style="color: #00b300;">Correct Answer:</span>
                    <div style="font-style: normal; font-weight: 600; margin-top: 4px; font-size: 16px;">${colorArticles(answer)}</div>
                  </div>
                </div>
              `;
            }
          }
          
          // Highlight the correct answer button
          optButtons.forEach(b => {
            const thisIsCorrect = (b.dataset.answer === 'true') === correctAnswer;
            if (thisIsCorrect) b.classList.add('correct');
            b.disabled = true;
          });
          
          onAnswer(userIsCorrect);
          $('#nextBtn').disabled = false;
          updateHeader();
          
          // Auto-progress if correct answer in blitz mode
          if (state.blitzMode && userIsCorrect) {
            setTimeout(() => {
              this.cleanup();
              progressExercise();
            }, 800);
          }
        };
        
        // Attach click handlers
        optButtons.forEach(btn => {
          const handler = handleOptionClick(btn);
          btn.onclick = handler;
          this.listeners.push({ element: btn, handler });
        });
        
        // Next button handler
        const nextBtn = $('#nextBtn');
        const handleNext = () => {
          this.cleanup();
          progressExercise();
        };
        nextBtn.onclick = handleNext;
        this.listeners.push({ element: nextBtn, handler: handleNext });
        
        // Enter key support
        const handleKeydown = (e) => {
          if (e.key === 'Enter' && !nextBtn.disabled && state.stage === 'truefalse') {
            nextBtn.click();
          }
        };
        document.addEventListener('keydown', handleKeydown);
        this.listeners.push({ element: document, event: 'keydown', handler: handleKeydown });
      },
      
      cleanup() {
        // Stop blitz timer
        stopBlitzTimer();
        
        // Remove all event listeners
        this.listeners.forEach(({ element, event, handler }) => {
          if (event) {
            element.removeEventListener(event, handler);
          }
        });
        this.listeners = [];
      }
    },

    // ===== MULTIPLE CHOICE EXERCISE =====
    multipleChoice: {
      listeners: [], // Track event listeners for cleanup
      
      render(item, answer, prompt, onAnswer) {
        const pool = state.batchItems.map(x => state.direction==='DE2EN' ? x.en : x.de);
        const wrongs = shuffle(pool.filter(x => !equals(x, answer))).slice(0, 3);
        const options = shuffle([answer, ...wrongs]).slice(0, 4);
        
        const questionCounter = state.testMode.active 
          ? `Q ${state.testMode.currentExerciseIdx + 1} / ${state.testMode.exercises.length}`
          : `Q ${state.qIdx+1} / ${state.batchItems.length}`;
        
        // Generate options with hints embedded
        const optionsWithHints = options.map((option, idx) => {
          // Find the item that matches this option
          const matchedItem = state.batchItems.find(x => {
            const trans = state.direction==='DE2EN' ? x.en : x.de;
            return equals(trans, option);
          });
          
          const hintHTML = matchedItem?.hint ? `
            <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 12px; font-style: italic; opacity: 0.75; line-height: 1.4; text-align: center;">
              <span style="font-weight: 600; font-style: normal; color: #ffb000; font-size: 11px;">💡</span> ${matchedItem.hint}
            </div>
          ` : '';
          
          return `
            <button class="opt" data-o="${encodeURIComponent(option)}">
              <div style="font-size: 16px; font-weight: 500; text-align: center;">${colorArticles(option)}</div>
              ${hintHTML}
            </button>
          `;
        });
        
        $('#stage').innerHTML = `
          <div class="title">
            <span>Multiple Choice</span>
            <span class="muted">${questionCounter}</span>
          </div>
          <div class="prompt" aria-live="polite">${colorArticles(prompt)}</div>
          <div class="options">
            ${optionsWithHints.join('')}
          </div>
          <div class="controls">
            <button id="nextBtn" disabled>Next</button>
          </div>`;
        
        updateHeader();
        
        let chosen = null, locked = false;
        const optButtons = [...document.querySelectorAll('.opt')];
        const promptEl = $('.prompt');
        
        // Blitz mode: Start timer
        if (state.blitzMode) {
          startBlitzTimer(
            // onBlur callback
            () => {
              if (promptEl) promptEl.classList.add('blurred');
            },
            // onTimeout callback
            () => {
              if (!locked) {
                // Time's up - mark as incorrect, show feedback, wait for user to click Next
                locked = true;
                onAnswer(false);
                state.mistakes.add(state.qOrder[state.qIdx]);
                
                // Unblur the prompt so user can see the original question
                if (promptEl) promptEl.classList.remove('blurred');
                
                // Highlight correct answer
                optButtons.forEach(b => {
                  if (equals(decodeURIComponent(b.dataset.o||''), answer)) {
                    b.classList.add('correct');
                  }
                  b.disabled = true;
                });
                
                // Enable Next button so user can proceed when ready
                $('#nextBtn').disabled = false;
                updateHeader();
              }
            }
          );
        }
        
        const handleOptionClick = (btn) => () => {
          if (locked) return;
          locked = true;
          
          // Stop blitz timer
          if (state.blitzMode) {
            stopBlitzTimer();
          }
          
          chosen = decodeURIComponent(btn.dataset.o||'');
          const correct = equals(chosen, answer);
          btn.classList.add(correct ? 'correct' : 'wrong');
          
          // If incorrect, unblur the prompt so user can see the original question
          if (!correct && promptEl) {
            promptEl.classList.remove('blurred');
          }
          
          // Highlight the correct answer
          optButtons.forEach(b => {
            if (equals(decodeURIComponent(b.dataset.o||''), answer)) b.classList.add('correct');
            b.disabled = true;
          });
          
          onAnswer(correct);
          $('#nextBtn').disabled = false;
          updateHeader();
          
          // Auto-progress if correct answer in blitz mode
          if (state.blitzMode && correct) {
            setTimeout(() => {
              this.cleanup();
              progressExercise();
            }, 800);
          }
        };
        
        // Attach click handlers
        optButtons.forEach(btn => {
          const handler = handleOptionClick(btn);
          btn.onclick = handler;
          this.listeners.push({ element: btn, handler });
        });
        
        // Next button handler
        const nextBtn = $('#nextBtn');
        const handleNext = () => {
          this.cleanup();
          progressExercise();
        };
        nextBtn.onclick = handleNext;
        this.listeners.push({ element: nextBtn, handler: handleNext });
        
        // Enter key support
        const handleKeydown = (e) => {
          if (e.key === 'Enter' && !nextBtn.disabled && state.stage === 'mcq') {
            nextBtn.click();
          }
        };
        document.addEventListener('keydown', handleKeydown);
        this.listeners.push({ element: document, event: 'keydown', handler: handleKeydown });
      },
      
      cleanup() {
        // Stop blitz timer
        stopBlitzTimer();
        
        // Remove all event listeners
        this.listeners.forEach(({ element, event, handler }) => {
          if (event) {
            element.removeEventListener(event, handler);
          }
        });
        this.listeners = [];
      }
    },

    // ===== WORD MATCHING EXERCISE =====
    wordMatching: {
      listeners: [],
      matches: new Map(), // Track which words are matched (leftWord -> rightWord)
      attempts: new Set(), // Track which words have been attempted (for scoring)
      lineElements: new Map(), // Track SVG line elements (leftWord -> SVG path)
      
      render(item, answer, prompt, onAnswer) {
        // Take all batch items for matching - use full batch size
        const items = state.batchItems;
        
        // Create shuffled arrays
        const leftWords = items.map(x => state.direction === 'DE2EN' ? x.de : x.en);
        const rightWords = shuffle([...items.map(x => state.direction === 'DE2EN' ? x.en : x.de)]);
        
        this.matches.clear();
        this.attempts.clear();
        this.lineElements.clear();
        
        $('#stage').innerHTML = `
          <div class="title">
            <span>Word Matching</span>
            <span class="muted">${items.length} Pairs</span>
          </div>
          <div class="matching-hint">
            💡 Drag words from the left to match with their translations on the right
          </div>
          <div class="matching-container" id="matchingContainer">
            <div class="matching-column" id="leftColumn">
              ${leftWords.map((word, i) => `
                <div class="matching-word" draggable="true" data-index="${i}" data-word="${encodeURIComponent(word)}">
                  ${colorArticles(word)}
                </div>
              `).join('')}
            </div>
            <div class="matching-column" id="rightColumn">
              ${rightWords.map((word, i) => `
                <div class="matching-word" data-index="${i}" data-word="${encodeURIComponent(word)}">
                  ${colorArticles(word)}
                </div>
              `).join('')}
            </div>
          </div>
          <svg id="matchLines" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;"></svg>
          <div class="controls">
            <button id="continueBtn" class="hidden" style="background: linear-gradient(135deg, var(--accent), #00b347); color: #001a06; border: none; font-weight: 600;">Continue</button>
          </div>
        `;
        
        updateHeader();
        
        let draggedElement = null;
        
        // Drag and drop handlers
        const leftWords_els = document.querySelectorAll('#leftColumn .matching-word');
        const rightWords_els = document.querySelectorAll('#rightColumn .matching-word');
        
        // Drag start
        leftWords_els.forEach(el => {
          const handleDragStart = (e) => {
            draggedElement = el;
            el.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
          };
          
          const handleDragEnd = (e) => {
            el.classList.remove('dragging');
            draggedElement = null;
          };
          
          el.addEventListener('dragstart', handleDragStart);
          el.addEventListener('dragend', handleDragEnd);
          this.listeners.push({ element: el, event: 'dragstart', handler: handleDragStart });
          this.listeners.push({ element: el, event: 'dragend', handler: handleDragEnd });
        });
        
        // Drop handlers
        rightWords_els.forEach(el => {
          const handleDragOver = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            el.style.borderColor = 'var(--accent)';
            el.style.transform = 'scale(1.05)';
          };
          
          const handleDragLeave = (e) => {
            el.style.borderColor = 'var(--border)';
            el.style.transform = '';
          };
          
          const handleDrop = (e) => {
            e.preventDefault();
            el.style.borderColor = 'var(--border)';
            el.style.transform = '';
            
            if (!draggedElement) return;
            
            const leftWord = decodeURIComponent(draggedElement.dataset.word);
            const rightWord = decodeURIComponent(el.dataset.word);
            
            // Find the correct answer for this left word
            const item = items.find(x => {
              const left = state.direction === 'DE2EN' ? x.de : x.en;
              return left === leftWord;
            });
            const correctRight = state.direction === 'DE2EN' ? item.en : item.de;
            const isCorrect = equals(rightWord, correctRight);
            
            // If this word was previously matched, remove old match
            if (this.matches.has(leftWord)) {
              const oldRightWord = this.matches.get(leftWord);
              // Remove old line
              if (this.lineElements.has(leftWord)) {
                this.lineElements.get(leftWord).remove();
                this.lineElements.delete(leftWord);
              }
              // Remove visual state from old right element
              const oldRightEl = [...rightWords_els].find(r => decodeURIComponent(r.dataset.word) === oldRightWord);
              if (oldRightEl) {
                oldRightEl.classList.remove('matched', 'correct', 'incorrect');
              }
            }
            
            // Store the new match
            this.matches.set(leftWord, rightWord);
            
            // Score only on first attempt
            if (!this.attempts.has(leftWord)) {
              this.attempts.add(leftWord);
              state.score.total++;
              
              if (isCorrect) {
                state.score.correct++;
                // Track for API - correct answer
                if (!state.isPracticeMistakesBatch && !state.testMode.active) {
                  fetch('/api/mistakes/increment', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sheet: state.sheet, de: item.de, en: item.en })
                  }).catch(e => console.error('Failed to increment mistake counter:', e));
                }
              } else {
                // Track mistake for this item
                const idx = state.batchItems.findIndex(x => x.de === item.de && x.en === item.en);
                if (idx !== -1) state.mistakes.add(idx);
                
                // Track for API - incorrect answer
                if (!state.testMode.active) {
                  fetch('/api/mistakes/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sheet: state.sheet, de: item.de, en: item.en })
                  }).catch(e => console.error('Failed to add mistake:', e));
                }
              }
              
              // Track test stats
              if (state.testMode.active) {
                const weight = state.testMode.stats.byType.matching.weight;
                state.testMode.stats.byType.matching.total++;
                state.testMode.stats.maxWeightedScore += weight;
                if (isCorrect) {
                  state.testMode.stats.byType.matching.correct++;
                  state.testMode.stats.weightedScore += weight;
                }
              }
            }
            
            // Visual feedback - always update
            draggedElement.classList.remove('matched', 'correct', 'incorrect');
            draggedElement.classList.add(isCorrect ? 'correct' : 'incorrect');
            el.classList.remove('matched', 'correct', 'incorrect');
            el.classList.add(isCorrect ? 'correct' : 'incorrect');
            
            // Draw connecting line with appropriate color
            const line = this.drawLine(draggedElement, el, isCorrect);
            this.lineElements.set(leftWord, line);
            
            updateHeader();
            
            // If incorrect, show red briefly then auto-reset
            if (!isCorrect) {
              setTimeout(() => {
                // Remove this match
                this.matches.delete(leftWord);
                
                // Remove the line
                if (this.lineElements.has(leftWord)) {
                  this.lineElements.get(leftWord).remove();
                  this.lineElements.delete(leftWord);
                }
                
                // Clear visual states and reset to original appearance
                draggedElement.classList.remove('incorrect', 'correct', 'matched');
                el.classList.remove('incorrect', 'correct', 'matched');
                
                // Reset inline styles to original state
                draggedElement.style.borderColor = '';
                draggedElement.style.transform = '';
                draggedElement.style.background = '';
                el.style.borderColor = '';
                el.style.transform = '';
                el.style.background = '';
              }, 500); // Show red for 0.5 seconds
            } else {
              // Check if all correct matches are made
              this.checkAllCorrect(items, leftWords_els, rightWords_els);
            }
          };
          
          el.addEventListener('dragover', handleDragOver);
          el.addEventListener('dragleave', handleDragLeave);
          el.addEventListener('drop', handleDrop);
          this.listeners.push({ element: el, event: 'dragover', handler: handleDragOver });
          this.listeners.push({ element: el, event: 'dragleave', handler: handleDragLeave });
          this.listeners.push({ element: el, event: 'drop', handler: handleDrop });
        });
        
        // Continue button handler
        const continueBtn = $('#continueBtn');
        const handleContinue = () => {
          this.cleanup();
          progressExercise();
        };
        continueBtn.onclick = handleContinue;
        this.listeners.push({ element: continueBtn, handler: handleContinue });
      },
      
      drawLine(leftEl, rightEl, isCorrect) {
        const svg = $('#matchLines');
        const leftRect = leftEl.getBoundingClientRect();
        const rightRect = rightEl.getBoundingClientRect();
        const svgRect = svg.getBoundingClientRect();
        
        const x1 = leftRect.right - svgRect.left;
        const y1 = leftRect.top + leftRect.height / 2 - svgRect.top;
        const x2 = rightRect.left - svgRect.left;
        const y2 = rightRect.top + rightRect.height / 2 - svgRect.top;
        
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const cx1 = x1 + (x2 - x1) / 3;
        const cx2 = x1 + 2 * (x2 - x1) / 3;
        const d = `M ${x1} ${y1} C ${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}`;
        
        path.setAttribute('d', d);
        path.setAttribute('class', `match-connector ${isCorrect ? 'correct' : 'incorrect'}`);
        svg.appendChild(path);
        
        return path; // Return the path element for tracking
      },
      
      checkAllCorrect(items, leftWords_els, rightWords_els) {
        // Check if all pairs have correct matches
        if (this.matches.size !== items.length) {
          return; // Not all matched yet
        }
        
        let allCorrect = true;
        this.matches.forEach((rightWord, leftWord) => {
          const item = items.find(x => {
            const left = state.direction === 'DE2EN' ? x.de : x.en;
            return left === leftWord;
          });
          const correctRight = state.direction === 'DE2EN' ? item.en : item.de;
          if (!equals(rightWord, correctRight)) {
            allCorrect = false;
          }
        });
        
        // Show continue button if all correct
        if (allCorrect) {
          $('#continueBtn').classList.remove('hidden');
        } else {
          $('#continueBtn').classList.add('hidden');
        }
      },
      
      cleanup() {
        // Remove all event listeners
        this.listeners.forEach(({ element, event, handler }) => {
          if (event) {
            element.removeEventListener(event, handler);
          }
        });
        this.listeners = [];
        this.matches.clear();
        this.attempts.clear();
        this.lineElements.clear();
      }
    },

    // ===== TYPING EXERCISE =====
    typing: {
      listeners: [],
      
      render(item, answer, prompt, onAnswer, practiceMode = false) {
        const seq = practiceMode ? state.practiceIndices : state.qOrder;
        
        const questionCounter = state.testMode.active 
          ? `Q ${state.testMode.currentExerciseIdx + 1} / ${state.testMode.exercises.length}`
          : `Q ${state.qIdx+1} / ${seq.length}`;
        
        $('#stage').innerHTML = `
          <div class="title">
            <span>${practiceMode ? 'Practice Mistakes' : 'Type the Translation'}</span>
            <span class="muted">${questionCounter}</span>
          </div>
          <div class="prompt" aria-live="polite">${colorArticles(prompt)}</div>
          <input id="answer" type="text" autocomplete="off" placeholder="Type here…" />
          <div class="char-buttons">
            <button class="char-btn" data-char="ß">ß</button>
            <button class="char-btn" data-char="ä">ä</button>
            <button class="char-btn" data-char="ö">ö</button>
            <button class="char-btn" data-char="ü">ü</button>
            <button class="char-btn" data-char="Ä">Ä</button>
            <button class="char-btn" data-char="Ö">Ö</button>
            <button class="char-btn" data-char="Ü">Ü</button>
          </div>
          <div class="controls">
            <button id="checkBtn">Check</button>
          </div>
          <div id="fb" class="muted" style="margin-top:8px"></div>
        `;
        
        const answerInput = $('#answer');
        answerInput.focus();
        const promptEl = $('.prompt');
        
        // Blitz mode: Start timer
        if (state.blitzMode && !practiceMode) {
          startBlitzTimer(
            // onBlur callback
            () => {
              if (promptEl) promptEl.classList.add('blurred');
            },
            // onTimeout callback
            () => {
              if (!checked) {
                // Time's up - mark as incorrect
                checked = true;
                
                // Stop blitz timer
                stopBlitzTimer();
                
                const userAnswer = answerInput.value;
                const correct = userAnswer && equals(userAnswer, answer);
                
                // Unblur the prompt so user can see the original question
                if (promptEl) promptEl.classList.remove('blurred');
                
                answerInput.style.borderColor = 'var(--bad)';
                $('#fb').innerHTML = `<span style="color:var(--bad); font-weight: 700;">⏰ Time's Up!</span> · ${correct ? 
                  `<span style="color:var(--ok);">You got it right!</span>` : 
                  `Correct answer: <b>${colorArticles(answer)}</b>`}`;
                
                onAnswer(correct);
                
                // Change button to "Next"
                const checkBtn = $('#checkBtn');
                checkBtn.textContent = 'Next';
                
                const nextAction = () => {
                  this.cleanup();
                  progressExercise();
                };
                
                checkBtn.onclick = nextAction;
                
                // Enter key for next
                const handleEnterNext = (e) => {
                  if (e.key === 'Enter') nextAction();
                };
                answerInput.addEventListener('keydown', handleEnterNext);
                this.listeners.push({ element: answerInput, event: 'keydown', handler: handleEnterNext });
                
                updateHeader();
              }
            }
          );
        }
        
        let checked = false;
        const doCheck = () => {
          if (checked) return;
          checked = true;
          
          // Stop blitz timer
          if (state.blitzMode && !practiceMode) {
            stopBlitzTimer();
          }
          
          const userAnswer = answerInput.value;
          const correct = equals(userAnswer, answer);
          
          // If incorrect, unblur the prompt so user can see the original question
          if (!correct && promptEl) {
            promptEl.classList.remove('blurred');
          }
          
          answerInput.style.borderColor = correct ? 'var(--ok)' : 'var(--bad)';
          $('#fb').innerHTML = correct 
            ? `<span style="color:var(--ok); font-weight: 600;">✓ Correct!</span>`
            : `<span style="color:var(--bad); font-weight: 600;">✗ Incorrect</span> · <b>${colorArticles(answer)}</b>`;
          
          onAnswer(correct);
          
          // Change button to "Next"
          const checkBtn = $('#checkBtn');
          checkBtn.textContent = 'Next';
          
          const nextAction = () => {
            this.cleanup();
            progressExercise();
          };
          
          // Auto-progress if correct answer in blitz mode
          if (state.blitzMode && !practiceMode && correct) {
            setTimeout(nextAction, 800);
          } else {
            // Wait for user to click Next
            checkBtn.onclick = nextAction;
            
            // Enter key for next
            const handleEnterNext = (e) => {
              if (e.key === 'Enter') nextAction();
            };
            answerInput.addEventListener('keydown', handleEnterNext);
            this.listeners.push({ element: answerInput, event: 'keydown', handler: handleEnterNext });
          }
          
          updateHeader();
        };
        
        // Check button handler
        const checkBtn = $('#checkBtn');
        checkBtn.onclick = doCheck;
        this.listeners.push({ element: checkBtn, handler: doCheck });
        
        // Enter key for check
        const handleEnterCheck = (e) => {
          if (e.key === 'Enter') doCheck();
        };
        answerInput.addEventListener('keydown', handleEnterCheck);
        this.listeners.push({ element: answerInput, event: 'keydown', handler: handleEnterCheck });
        
        // German character buttons
        const charButtons = [...document.querySelectorAll('.char-btn')];
        charButtons.forEach(btn => {
          const handleCharClick = () => {
            const char = btn.dataset.char;
            const start = answerInput.selectionStart;
            const end = answerInput.selectionEnd;
            const text = answerInput.value;
            answerInput.value = text.substring(0, start) + char + text.substring(end);
            answerInput.focus();
            answerInput.setSelectionRange(start + char.length, start + char.length);
          };
          btn.onclick = handleCharClick;
          this.listeners.push({ element: btn, handler: handleCharClick });
        });
      },
      
      cleanup() {
        // Stop blitz timer
        stopBlitzTimer();
        
        // Remove all event listeners
        this.listeners.forEach(({ element, event, handler }) => {
          if (event) {
            element.removeEventListener(event, handler);
          }
        });
        this.listeners = [];
      }
    },

    // ===== SENTENCE ORDERING EXERCISE =====
    sentenceOrdering: {
      listeners: [],
      
      render(item, answer, prompt, onAnswer) {
        // Use only items with a usable sentence (hint with >= 3 tokens)
        const eligibleIndices = state.batchItems
          .map((w, i) => ({ i, h: (w.hint || '').trim() }))
          .filter(x => x.h.split(/\s+/).length >= 3)
          .map(x => x.i);
        
        const shuffled = shuffle(eligibleIndices.length ? eligibleIndices : [...Array(state.batchItems.length).keys()]);
        
        const questionCounter = state.testMode.active 
          ? `Q ${state.testMode.currentExerciseIdx + 1} / ${state.testMode.exercises.length}`
          : `Q ${state.qIdx+1} / ${state.qOrder.length}`;
        
        const targetId = 'sentenceTarget';
        const bankId = 'tokenBank';
        
        $('#stage').innerHTML = `
          <div class="title">
            <span>Sentence Ordering</span>
            <span class="muted">${questionCounter}</span>
          </div>
        
          <div class="prompt" style="margin-bottom: 12px;">Arrange the words to form the correct sentence</div>
        
          <div id="${targetId}" style="display:flex; flex-wrap:wrap; gap:10px; padding:16px; min-height:64px; background: var(--btn); border: 2px dashed var(--border); border-radius: 12px;"></div>

          <div id="${bankId}" style="display:flex; flex-wrap:wrap; gap:10px; padding:14px; background: linear-gradient(135deg, rgba(0, 255, 65,0.12), rgba(0, 255, 65,0.04)); border: 1px solid var(--border); border-radius: 12px;"></div>
        
          <div id="orderFeedback" style="margin-top:12px;"></div>
        
          <div class="controls" style="margin-top: 16px; display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
            <button id="clearBtn" style="background: var(--btn); color: var(--fg); border: 2px solid var(--border);">Clear</button>
            <button id="checkBtn" disabled>Check</button>
          </div>
        `;
        
        const targetEl = $('#'+targetId);
        const bankEl = $('#'+bankId);
        const feedbackEl = $('#orderFeedback');
        const checkBtn = $('#checkBtn');
        const clearBtn = $('#clearBtn');
        
        const makeChip = (text, isBank) => {
          const btn = document.createElement('button');
          btn.className = 'word-chip';
          btn.textContent = text;
          btn.style.cssText = 'padding:10px 14px; border-radius:999px; border:1px solid var(--border); background:var(--app-bg); box-shadow:0 2px 6px rgba(0,0,0,0.06); transition:transform 0.1s ease;';
          if (isBank) {
            btn.onclick = () => {
              const placed = makeChip(text, false);
              targetEl.appendChild(placed);
              btn.remove();
              updateState();
            };
          } else {
            btn.onclick = () => {
              const back = makeChip(text, true);
              bankEl.appendChild(back);
              btn.remove();
              updateState();
            };
          }
          return btn;
        };
        
        shuffled.forEach(tok => bankEl.appendChild(makeChip(tok, true)));
        
        function getCurrentAnswer() {
          return Array.from(targetEl.querySelectorAll('.word-chip')).map(x => x.textContent).join(' ');
        }
        
        function updateState() {
          const placedCount = targetEl.querySelectorAll('.word-chip').length;
          checkBtn.disabled = placedCount !== shuffled.length;
          feedbackEl.innerHTML = '';
        }
        
        clearBtn.onclick = () => {
          Array.from(targetEl.querySelectorAll('.word-chip')).forEach(ch => {
            const back = makeChip(ch.textContent, true);
            bankEl.appendChild(back);
            ch.remove();
          });
          updateState();
        };
        
        checkBtn.onclick = () => {
          const userSentence = getCurrentAnswer();
          const correct = userSentence === shuffled.join(' ');
          feedbackEl.innerHTML = correct
            ? `<div class="hint-box" style="margin-top: 8px; background: linear-gradient(135deg, rgba(0, 255, 65, 0.12), rgba(0, 255, 65, 0.08)); border-left-color: #00ff41;"><div class="hint-icon" style="font-size: 24px; color: #00ff41;">✓</div><div class="hint-content"><span class="hint-label" style="color:#00b300;">Correct!</span><div style="margin-top:4px; font-weight:600;">${shuffled.join(' ')}</div></div></div>`
            : `<div class="hint-box" style="margin-top: 8px;"><div class="hint-icon">💡</div><div class="hint-content"><span class="hint-label">Target:</span>${shuffled.join(' ')}</div></div>`;
        
          // Call standard answer handler for scoring/mistakes
          // (We reuse the multiple choice/typing patterns)
          (async () => {
            // mimic onAnswer from other wrappers
            state.score.total++;
            if (correct) {
              state.score.correct++;
              if (!state.isPracticeMistakesBatch && !state.testMode.active) {
                try {
                  await fetch('/api/mistakes/increment', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sheet: state.sheet, de: item.de, en: item.en })
                  });

              }
            } else {
              state.mistakes.add(idx);
              if (!state.testMode.active) {
                try {
                  await fetch('/api/mistakes/add', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ sheet: state.sheet, de: item.de, en: item.en })
                  });
                } catch (e) { console.error('Failed to add mistake:', e); }
              }
            }
          })();
        
          // Replace controls with Next button
          const controls = feedbackEl.nextElementSibling;
          controls.innerHTML = `<button id="nextBtn">Next</button>`;
          $('#nextBtn').onclick = () => {
            progressExercise();
          };
        };
        
        updateState();
      },
      
      cleanup() {
        // Stop blitz timer
        stopBlitzTimer();
        
        // Remove all event listeners
        this.listeners.forEach(({ element, event, handler }) => {
          if (event) {
            element.removeEventListener(event, handler);
          }
        });
        this.listeners = [];
      }
    }
  };

  // --- Theme + Direction + Batch Size init ---
  document.body.setAttribute('data-theme', state.theme);
  // Initialize modern controls
  $('#sheetSelect').value = state.sheet || '';
  
  // Direction toggle
  document.querySelectorAll('.dir-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.dir === state.direction);
  });
  
  // Theme toggle
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.theme === state.theme);
  });
  
  // Batch size slider
  $('#batchSizeSlider').value = state.batchSize;
  $('.slider-value').textContent = `${state.batchSize} words`;

  // Direction toggle handlers
  document.querySelectorAll('.dir-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.direction = btn.dataset.dir;
      localStorage.setItem('direction', state.direction);
      
      // Only restart batch if actively in a quiz, otherwise just refresh the intro
      if (state.stage === 'mcq' || state.stage === 'typing' || state.stage === 'practice') {
        startBatch(true);
      } else if (state.stage === 'intro' && state.sheet) {
        renderIntro();
      }
    });
  });
  
  // Theme toggle handlers
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.theme = btn.dataset.theme;
      localStorage.setItem('theme', state.theme);
      document.body.setAttribute('data-theme', state.theme);
    });
  });
  
  // Batch size slider handler
  $('#batchSizeSlider').addEventListener('input', async e => {
    const value = parseInt(e.target.value);
    state.batchSize = value;
    localStorage.setItem('batchSize', state.batchSize);
    $('.slider-value').textContent = `${value} words`;
    
    // Recalculate batches and reset to batch 0
    if (state.sheet) {
      state.totalBatches = Math.max(1, Math.ceil(state.pairs.length / state.batchSize));
      state.batchIndex = 0;
      localStorage.setItem('batchIndex', 0);
      renderIntro();
    }
  });

  // --- Fetchers ---
  async function getJSON(url, opts){ const r = await fetch(url, opts); if(!r.ok) throw new Error(await r.text()); return r.json(); }

  async function loadSheets(){
    const { sheets } = await getJSON('/api/sheets');
    state.sheets = sheets;
    const sel = $('#sheetSelect'); sel.innerHTML = sheets.map(s => `<option value="${s.name}">${s.name} (${s.count})</option>`).join('');
    const remembered = localStorage.getItem('sheet');
    state.sheet = (sheets.find(s=>s.name===remembered) ? remembered : (sheets[0]?.name || null));
    if (!state.sheet) { $('#stage').innerHTML = `<div class="title">No data</div><div class="prompt">Place <b>data/flashcards.xlsx</b> and refresh.</div>`; return; }
    sel.value = state.sheet;
    await loadSet(state.sheet);
  }

  $('#sheetSelect').addEventListener('change', async (e) => {
    state.sheet = e.target.value; localStorage.setItem('sheet', state.sheet);
    await loadSet(state.sheet);
  });

  async function loadSet(sheet){
    const { pairs } = await getJSON('/api/set?sheet='+encodeURIComponent(sheet));
    state.pairs = pairs;
    state.totalBatches = Math.max(1, Math.ceil(state.pairs.length / state.batchSize));
    const p = await getJSON('/api/progress?sheet='+encodeURIComponent(sheet));
    const savedBatchIndex = localStorage.getItem('batchIndex');
    state.batchIndex = savedBatchIndex !== null ? 
      Math.min(parseInt(savedBatchIndex), state.totalBatches-1) : 
      Math.min(p.batchIndex || 0, state.totalBatches-1);
    renderIntro();
  }

  // --- Rendering helpers ---
  function updateHeader(){
    // Show/hide restart button based on stage
    const inQuiz = state.stage === 'mcq' || state.stage === 'typing' || state.stage === 'practice' || state.stage === 'truefalse' || state.stage === 'matching' ||
                   state.stage === 'test-mcq' || state.stage === 'test-typing' || state.stage === 'test-truefalse' || state.stage === 'test-matching' || state.stage === 'sentenceorder';
    $('#restartBtn').style.display = (inQuiz && !state.testMode.active) ? 'block' : 'none';
    
    // Show/hide header controls based on stage
    // Hide controls when user is in exercise selection, practice, or test modes
    const inPracticeMode = state.stage === 'exercise-selection' || state.stage === 'test-config' || inQuiz;
    $('#headerControls').style.display = inPracticeMode ? 'none' : 'flex';
  }

  async function renderIntro(){
    if (state.pairs.length === 0) {
      $('#stage').innerHTML = `<div class="title">Empty set</div><div class="prompt">Selected worksheet has no valid rows.</div>`;
      return;
    }
    
    // Fetch mistakes for this sheet
    let mistakesData = [];
    try {
      const response = await getJSON(`/api/mistakes?sheet=${encodeURIComponent(state.sheet)}`);
      mistakesData = response.mistakes || [];
    } catch (e) {
      console.error('Failed to load mistakes:', e);
    }
    
    // Fetch exercise completion data for this sheet
    let exerciseCompletion = {};
    try {
      const response = await getJSON(`/api/exercise-completion?sheet=${encodeURIComponent(state.sheet)}`);
      exerciseCompletion = response.exerciseCompletion || {};
    } catch (e) {
      console.error('Failed to load exercise completion:', e);
    }
    
    const start = state.batchIndex * state.batchSize;
    const end   = Math.min(start + state.batchSize, state.pairs.length);
    const preview = state.pairs.slice(start, end);
    
    // Calculate test unlock status - check if all batches have all exercises complete
    const exercises = exerciseTypeOptions.map(ex => ex.id);
    let completedBatches = 0;
    
    for (let i = 0; i < state.totalBatches; i++) {
      const batchStart = i * state.batchSize;
      const batchEnd = Math.min(batchStart + state.batchSize, state.pairs.length);
      const batchPairs = state.pairs.slice(batchStart, batchEnd);
      const batchWordKeys = batchPairs.map(p => `${p.de}|${p.en}`);
      const totalWords = batchPairs.length;
      
      let allExercisesComplete = true;
      for (const exerciseId of exercises) {
        const globallyCompletedWords = exerciseCompletion[exerciseId] || [];
        const completedInBatch = batchWordKeys.filter(key => globallyCompletedWords.includes(key)).length;
        const completionPercent = totalWords > 0 ? (completedInBatch / totalWords) * 100 : 0;
        
        if (completedInBatch !== totalWords) {
          allExercisesComplete = false;
          break;
        }
      }
      
      if (allExercisesComplete) completedBatches++;
    }
    
    const isTestUnlocked = completedBatches === state.totalBatches;
    
    // Check if test just unlocked (for animation)
    const testWasLocked = localStorage.getItem(`testWasLocked_${state.sheet}`) === 'true';
    const justUnlocked = testWasLocked && isTestUnlocked;
    
    // Update localStorage
    if (isTestUnlocked) {
      localStorage.setItem(`testWasLocked_${state.sheet}`, 'false');
    } else {
      localStorage.setItem(`testWasLocked_${state.sheet}`, 'true');
    }
    
    // Generate Test card
    let testCard = '';
    if (isTestUnlocked) {
      testCard = `
        <div class="test-card test-unlocked ${justUnlocked ? 'just-unlocked' : ''}" id="testCard">
          <div class="test-icon">📝</div>
          <div class="test-title">Final Test - Ready!</div>
          <div class="test-subtitle">Test your mastery with a comprehensive exam</div>
          <div class="test-cta">Start Test →</div>
        </div>
      `;
    } else {
      testCard = `
        <div class="test-card test-locked">
          <div class="test-icon">🔒</div>
          <div class="test-title">Final Test</div>
          <div class="test-subtitle">Complete all exercises for all batches to unlock</div>
          <div class="test-progress">${completedBatches} / ${state.totalBatches} batches mastered</div>
        </div>
      `;
    }
    
    // Generate Practice Mistakes batch card if there are mistakes
    let mistakesBatchCard = '';
    if (mistakesData.length > 0) {
      const previewWords = mistakesData.slice(0, 10).map(m => {
        const german = colorArticles(m.de);
        return `<span class="batch-preview-word">${german}</span>`;
      }).join('<span class="batch-preview-separator">•</span>');
      
      const moreText = mistakesData.length > 10 ? ` <span style="opacity: 0.7;">+${mistakesData.length - 10} more</span>` : '';
      
      mistakesBatchCard = `
        <div class="batch-card practice-mistakes-batch" data-batch="mistakes">
          <div class="batch-card-header">
            <span class="batch-number">⚠️ Practice Mistakes</span>
            <span class="batch-badge" style="background: #00cc44; color: #001a06;">${mistakesData.length} word${mistakesData.length > 1 ? 's' : ''}</span>
            <button class="clear-mistakes-btn" id="clearMistakesBtn" title="Clear all mistakes">
              <span>🗑️</span>
              <span>Clear</span>
            </button>
          </div>
          <div class="batch-preview">${previewWords}${moreText}</div>
        </div>
      `;
    }
    
    // Generate batch cards with previews
    const batchCards = Array.from({length: state.totalBatches}, (_, i) => {
      const batchStart = i * state.batchSize;
      const batchEnd = Math.min(batchStart + state.batchSize, state.pairs.length);
      const batchPairs = state.pairs.slice(batchStart, batchEnd);
      
      // Create preview with only German words on one line
      const previewWords = batchPairs.map(p => {
        const german = colorArticles(p.de);
        return `<span class="batch-preview-word">${german}</span>`;
      }).join('<span class="batch-preview-separator">•</span>');
      
      // Calculate exercise completion for this batch based on actual words
      const totalWords = batchPairs.length;
      // Create word keys for this batch
      const batchWordKeys = batchPairs.map(p => `${p.de}|${p.en}`);
      
      // Exercise types to track (excluding test-mode, ordered by difficulty)
      const exercises = [
        { id: 'truefalse-only', icon: '❓', name: 'True/False', colorClass: 'truefalse-completed' },
        { id: 'mcq-only', icon: '✓', name: 'Multiple Choice', colorClass: 'mcq-completed' },
        { id: 'matching-only', icon: '🔗', name: 'Word Matching', colorClass: 'matching-completed' },
        { id: 'typing-only', icon: '⌨️', name: 'Typing', colorClass: 'typing-completed' },
        { id: 'sentence-order-only', icon: '🧩', name: 'Unscramble', colorClass: 'sentence-completed' }
      ];
      
      let completedCount = 0;
      const exerciseIcons = exercises.map(ex => {
        // Get globally completed words for this exercise
        const globallyCompletedWords = exerciseCompletion[ex.id] || [];
        // Count how many of THIS batch's words are completed
        const completedInBatch = batchWordKeys.filter(wordKey => 
          globallyCompletedWords.includes(wordKey)
        ).length;
        const completionPercent = totalWords > 0 ? (completedInBatch / totalWords) * 100 : 0;
        const isComplete = totalWords > 0 && completedInBatch === totalWords;
        if (isComplete) completedCount++;
        
        const completedClass = isComplete ? `completed ${ex.colorClass}` : '';
        return `<div class="exercise-icon ${completedClass}" data-exercise="${ex.id}" title="${ex.name}: ${Math.round(completionPercent)}% (${completedInBatch}/${totalWords})">
          ${ex.icon}
          <span class="tooltip">${ex.name}: ${Math.round(completionPercent)}%</span>
        </div>`;
      }).join('');
      
      const allComplete = completedCount === exercises.length ? 'all-exercises-complete' : '';
      const doneBadge = completedCount === exercises.length ? '<span class="batch-badge badge-completed">✓ Done</span>' : '';
      
      return `
        <div class="batch-card ${allComplete}" data-batch="${i}">
          <div class="batch-card-header">
            <span class="batch-number">Batch ${i + 1}</span>
            ${doneBadge}
          </div>
          <div class="batch-preview">${previewWords}</div>
          <div class="exercise-icons-row">
            ${exerciseIcons}
          </div>
        </div>
      `;
    }).join('');
    
    $('#stage').innerHTML = `
      <div class="prompt">Select a Batch to Practice</div>
      <div class="batch-selector">
        <div class="batch-selector-title" style="display: flex; justify-content: space-between; align-items: center;">
          <span>Available Batches (${mistakesData.length > 0 ? state.totalBatches + 1 : state.totalBatches})</span>
          <button id="resetSheetProgressBtn" style="padding: 8px 16px; font-size: 13px; background: linear-gradient(135deg, rgba(255, 46, 58,0.15), rgba(255, 46, 58,0.05)); border: 1px solid rgba(255, 46, 58,0.5); color: var(--fg); border-radius: 8px; cursor: pointer; transition: all 0.2s ease;" title="Reset all progress for this sheet">
            🔄 Reset Progress
          </button>
        </div>
        <div class="batch-list">
          ${testCard}
          ${mistakesBatchCard}
          ${batchCards}
        </div>
      </div>`;
    
    // Add batch selection functionality - clicking shows exercise type selection
    [...document.querySelectorAll('.batch-card')].forEach(card => {
      card.onclick = async (e) => {
        // Don't trigger if clicking the clear button or exercise icons
        if (e.target.closest('.clear-mistakes-btn') || e.target.closest('.exercise-icon')) return;
        
        const batchData = card.dataset.batch;
        
        if (batchData === 'mistakes') {
          // Handle Practice Mistakes batch
          state.isPracticeMistakesBatch = true;
          state.batchItems = mistakesData; // mistakesData already has {de, en, correctCount}
          renderExerciseSelection();
        } else {
          // Handle regular batch - temporarily set for this exercise session
          state.isPracticeMistakesBatch = false;
          const batchIndex = parseInt(batchData);
          state.batchIndex = batchIndex;
          renderExerciseSelection();
        }
      };
    });
    
    // Add exercise icon click functionality
    [...document.querySelectorAll('.exercise-icon')].forEach(icon => {
      icon.onclick = async (e) => {
        e.stopPropagation(); // Prevent batch card click
        
        const exerciseId = icon.dataset.exercise;
        const batchCard = icon.closest('.batch-card');
        const batchData = batchCard.dataset.batch;
        
        if (batchData === 'mistakes') {
          // Handle Practice Mistakes batch
          state.isPracticeMistakesBatch = true;
          state.batchItems = mistakesData;
        } else {
          // Handle regular batch
          state.isPracticeMistakesBatch = false;
          const batchIndex = parseInt(batchData);
          state.batchIndex = batchIndex;
        }
        
        // Start the specific exercise
        switch (exerciseId) {
          case 'truefalse-only':
            startTrueFalseOnly();
            break;
          case 'mcq-only':
            startMCQOnly();
            break;
          case 'matching-only':
            startWordMatchingOnly();
            break;
          case 'sentence-order-only':
            startSentenceOrderingOnly();
            break;
          case 'typing-only':
            startTypingOnly();
            break;
          default:
            console.warn('Unknown exercise ID:', exerciseId);
        }
      };
    });
    
    // Add clear mistakes button handler
    const clearBtn = $('#clearMistakesBtn');
    if (clearBtn) {
      clearBtn.onclick = (e) => {
        e.stopPropagation(); // Prevent batch card click
        showConfirmModal(
          '🗑️',
          'Clear All Mistakes?',
          `Are you sure you want to clear all ${mistakesData.length} mistake${mistakesData.length > 1 ? 's' : ''}? This action cannot be undone.`,
          async () => {
            try {
              await fetch('/api/mistakes', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sheet: state.sheet })
              });
              // Refresh the intro to show updated list
              renderIntro();
            } catch (e) {
              console.error('Failed to clear mistakes:', e);
              alert('Failed to clear mistakes. Please try again.');
            }
          }
        );
      };
    }
    
    // Add reset sheet progress button handler
    const resetProgressBtn = $('#resetSheetProgressBtn');
    if (resetProgressBtn) {
      resetProgressBtn.onclick = () => {
        showConfirmModal(
          '🔄',
          'Reset All Progress?',
          `Are you sure you want to reset all progress for "${state.sheet}"? This will clear your batch progress, exercise completion, and mistakes. This action cannot be undone.`,
          async () => {
            try {
              await fetch('/api/reset-sheet-progress', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ sheet: state.sheet })
              });
              // Reload the set to refresh everything
              await loadSet(state.sheet);
            } catch (e) {
              console.error('Failed to reset sheet progress:', e);
              alert('Failed to reset progress. Please try again.');
            }
          }
        );
      };
    }
    
    // Add test card click handler
    const testCardEl = $('#testCard');
    if (testCardEl && isTestUnlocked) {
      testCardEl.onclick = () => {
        renderTestConfiguration();
      };
    }
    
    state.stage = 'intro';
    state.score = {correct:0,total:0};
    state.mistakes = new Set();
    updateHeader();
  }

  // =============================================================================

    },

    },
    {

    }

  function renderExerciseSelection() {
    state.stage = 'exercise-selection';
    
    // Calculate batch size and name based on whether it's practice mistakes batch
    let batchSize, batchName;
    if (state.isPracticeMistakesBatch) {
      batchSize = state.batchItems.length;
      batchName = '⚠️ Practice Mistakes';
    } else {
      const start = state.batchIndex * state.batchSize;
      const end = Math.min(start + state.batchSize, state.pairs.length);
      batchSize = end - start;
      batchName = `Batch ${state.batchIndex + 1}`;
    }

      <div class="exercise-type-card" data-exercise-id="${ex.id}">
        <span class="exercise-type-icon">${ex.icon}</span>
        <div class="exercise-type-title">${ex.title}</div>
        <div class="exercise-type-description">${ex.description}</div>
        <div class="exercise-type-meta">
          ${ex.badges.map((badge, i) =>

      <!-- Blitz Mode Toggle -->

        <div class="blitz-toggle-label" id="blitzToggle">
          <span class="blitz-icon">⚡</span>
          <span class="blitz-toggle-text">Blitz Mode</span>
          <div class="blitz-switch ${state.blitzMode ? 'active' : ''}" id="blitzSwitch">
            <div class="blitz-switch-knob"></div>
          </div>
        </div>
        ${state.blitzMode ? `
          <div class="blitz-settings">
            <div class="blitz-setting">
              <label class="blitz-setting-label">View Time</label>

            </div>
            <div class="blitz-setting">
              <label class="blitz-setting-label">Answer Time</label>
              <input type="number" class="blitz-setting-input" id="blitzAnswerTime" value="${state.blitzAnswerTime}" min="3" max="30">

  // =============================================================================
  // TEST MODE CONFIGURATION
  // =============================================================================
  
  function renderTestConfiguration() {
    state.stage = 'test-config';
    
    let selectedSize = 'medium';
    let selectedDifficulty = 'medium';
    
    const sizeOptions = [
      { id: 'short', icon: '⚡', title: 'Short', desc: `${Math.floor(state.pairs.length / 3)} words (1/3 of set)` },
      { id: 'medium', icon: '📚', title: 'Medium', desc: `${Math.floor(state.pairs.length * 2 / 3)} words (2/3 of set)` },
      { id: 'long', icon: '🎯', title: 'Long', desc: `${state.pairs.length} words (Full set)` }
    ];
    
    const difficultyOptions = [
      { id: 'easy', icon: '😊', title: 'Easy', desc: 'More MCQ, less typing' },
      { id: 'medium', icon: '😐', title: 'Medium', desc: 'Balanced mix' },
      { id: 'hard', icon: '😤', title: 'Hard', desc: 'Mostly typing exercises' }

          <div class="test-config-icon">${opt.icon}</div>
          <div class="test-config-title">${opt.title}</div>
          <div class="test-config-desc">${opt.desc}</div>
        </div>
      `).join('');
      
      const difficultyCards = difficultyOptions.map(opt => `
        <div class="test-config-card ${selectedDifficulty === opt.id ? 'selected' : ''}" data-difficulty="${opt.id}">
          <div class="test-config-icon">${opt.icon}</div>
          <div class="test-config-title">${opt.title}</div>
          <div class="test-config-desc">${opt.desc}</div>
        </div>
      `).join('');
      
      $('#stage').innerHTML = `
        <div class="prompt" style="text-align: center; margin-bottom: 24px;">Configure Your Test</div>
        
        <div style="margin-bottom: 32px;">
          <div class="title" style="margin-bottom: 16px;">Test Size</div>
          <div class="test-config-grid">
            ${sizeCards}
          </div>
        </div>
        
        <div style="margin-bottom: 32px;">
          <div class="title" style="margin-bottom: 16px;">Difficulty Level</div>
          <div class="test-config-grid">
            ${difficultyCards}
          </div>
        </div>
        
        <div class="controls" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">

      document.querySelectorAll('[data-size]').forEach(card => {

      // Attach difficulty selection handlers
      document.querySelectorAll('[data-difficulty]').forEach(card => {
        card.onclick = () => {
          selectedDifficulty = card.dataset.difficulty;
          renderOptions();
        };
      });
      
      // Back button
      $('#backBtn').onclick = renderExerciseSelection;
      
      // Start test button
      $('#startTestBtn').onclick = () => startTestMode(selectedSize, selectedDifficulty);
    };
    
    renderOptions();
    updateHeader();
  }
  
  // =============================================================================
  // BLITZ MODE TIMER
  // =============================================================================
  
  function startBlitzTimer(onBlur, onTimeout) {
    // Clear any existing timer
    if (state.blitzTimer) {
      clearInterval(state.blitzTimer);
    }
    
    let totalTime = state.blitzViewTime + state.blitzAnswerTime;
    let timeLeft = totalTime;
    let viewPhase = true;
    
    // Create timer element
    const timerHTML = `

  function generateTestExercises(words, difficulty) {
    // Define distribution based on difficulty
    const distributions = {
      easy: { mcq: 0.40, truefalse: 0.30, typing: 0.20, matching: 0.10 },
      medium: { mcq: 0.30, truefalse: 0.30, typing: 0.30, matching: 0.10 },
      hard: { mcq: 0.20, truefalse: 0.20, typing: 0.50, matching: 0.10 }
    };
    
    const dist = distributions[difficulty];
    const totalWords = words.length;
    const exercises = [];
    
    // Create shuffled indices
    const indices = shuffle([...Array(totalWords).keys()]);
    let currentIdx = 0;
    
    // Determine if we include word matching (only if more than 10 words)
    const includeMatching = totalWords > 10;
    const matchingWords = includeMatching ? 5 : 0;
    
    // Reserve words for guaranteed exercises
    // Guarantee at least 1 of each type: MCQ, True/False, Typing
    const guaranteedExercises = 3; // MCQ, True/False, Typing
    const reservedWords = guaranteedExercises + matchingWords;
    
    // Add guaranteed exercises first
    // 1. Guaranteed MCQ
    exercises.push({ type: 'mcq', wordIndices: [indices[currentIdx++]] });
    
    // 2. Guaranteed True/False
    exercises.push({ type: 'truefalse', wordIndices: [indices[currentIdx++]] });
    
    // 3. Guaranteed Typing
    exercises.push({ type: 'typing', wordIndices: [indices[currentIdx++]] });
    
    // Calculate remaining words after guaranteed exercises
    const remainingWords = totalWords - currentIdx - matchingWords;
    
    if (remainingWords > 0) {
      // Adjust distribution percentages
      const adjustedDist = includeMatching ? {
        mcq: dist.mcq / (1 - dist.matching),
        truefalse: dist.truefalse / (1 - dist.matching),
        typing: dist.typing / (1 - dist.matching)
      } : {
        mcq: dist.mcq / (dist.mcq + dist.truefalse + dist.typing),
        truefalse: dist.truefalse / (dist.mcq + dist.truefalse + dist.typing),
        typing: dist.typing / (dist.mcq + dist.truefalse + dist.typing)
      };
      
      // Calculate additional exercises based on distribution
      const additionalMCQ = Math.floor(remainingWords * adjustedDist.mcq);
      const additionalTrueFalse = Math.floor(remainingWords * adjustedDist.truefalse);
      const additionalTyping = remainingWords - additionalMCQ - additionalTrueFalse;
      
      // Add additional MCQ exercises
      for (let i = 0; i < additionalMCQ && currentIdx < totalWords - matchingWords; i++) {
        exercises.push({ type: 'mcq', wordIndices: [indices[currentIdx++]] });
      }
      
      // Add additional True/False exercises
      for (let i = 0; i < additionalTrueFalse && currentIdx < totalWords - matchingWords; i++) {
        exercises.push({ type: 'truefalse', wordIndices: [indices[currentIdx++]] });
      }
      
      // Add additional Typing exercises
      for (let i = 0; i < additionalTyping && currentIdx < totalWords - matchingWords; i++) {
        exercises.push({ type: 'typing', wordIndices: [indices[currentIdx++]] });
      }
    }
    
    // Add exactly ONE Word Matching exercise (5 words) if we have more than 10 words total
    if (includeMatching && currentIdx + 5 <= totalWords) {
      const matchIndices = indices.slice(currentIdx, currentIdx + 5);
      exercises.push({ type: 'matching', wordIndices: matchIndices });
      currentIdx += 5;
    }
    
    // Add any remaining words as typing exercises
    while (currentIdx < totalWords) {
      exercises.push({ type: 'typing', wordIndices: [indices[currentIdx++]] });
    }
    
    // Shuffle all exercises for random order
    return shuffle(exercises);
  }
  
  function startTestMode(size, difficulty) {
    // Calculate word count based on size
    const allWords = state.pairs;
    let wordCount;
    
    switch (size) {
      case 'short':
        wordCount = Math.floor(allWords.length / 3);
        break;
      case 'medium':
        wordCount = Math.floor(allWords.length * 2 / 3);
        break;
      case 'long':
        wordCount = allWords.length;
        break;
    }
    
    // Randomly select words
    const shuffledWords = shuffle([...allWords]);
    state.batchItems = shuffledWords.slice(0, wordCount);
    
    // Generate test exercises
    const exercises = generateTestExercises(state.batchItems, difficulty);
    
    // Initialize test mode
    state.testMode.active = true;
    state.testMode.exercises = exercises;
    state.testMode.currentExerciseIdx = 0;
    state.testMode.size = size;
    state.testMode.difficulty = difficulty;
    state.testMode.stats = {

        matching: {correct: 0, total: 0, weight: 1}
      },

    };
    state.exerciseMode = 'test-mode';

    // Start timer

  function renderTestExercise() {
    // Clean up previous exercise handlers
    if (ExerciseTypes.multipleChoice?.cleanup) ExerciseTypes.multipleChoice.cleanup();
    if (ExerciseTypes.trueFalse?.cleanup) ExerciseTypes.trueFalse.cleanup();
    if (ExerciseTypes.typing?.cleanup) ExerciseTypes.typing.cleanup();
    if (ExerciseTypes.wordMatching?.cleanup) ExerciseTypes.wordMatching.cleanup();
    if (ExerciseTypes.sentenceOrdering?.cleanup) ExerciseTypes.sentenceOrdering.cleanup();
    
    const exercise = state.testMode.exercises[state.testMode.currentExerciseIdx];
    
    // Store original batch items if needed
    if (!state.testMode.originalBatchItems) {
      state.testMode.originalBatchItems = [...state.batchItems];
    }
    
    // Set up the batch items for this exercise
    if (exercise.type === 'matching') {
      // For matching, create a subset of batch items
      const matchingItems = exercise.wordIndices.map(idx => state.testMode.originalBatchItems[idx]);
      state.batchItems = matchingItems;
    } else {
      // For single-word exercises, set qOrder to point to the correct index
      state.qOrder = [exercise.wordIndices[0]];
      state.qIdx = 0;
      // Restore original batch items
      state.batchItems = state.testMode.originalBatchItems;
    }
    
    // Render the appropriate exercise
    switch (exercise.type) {
      case 'mcq':
        state.stage = 'test-mcq';
        renderMCQ();

        state.stage = 'test-typing';
        renderTyping();
        break;

        renderTrueFalse();
        break;
      case 'matching':

        renderWordMatching();
        break;
      case 'sentence-order-only':

        break;

  // Handle progression between exercises
  function progressExercise() {
    // Test mode progression
    if (state.testMode.active) {
      state.testMode.currentExerciseIdx++;
      
      if (state.testMode.currentExerciseIdx >= state.testMode.exercises.length) {
        // Test complete - stop timer first, then set end time
        stopTestTimer();
        state.testMode.stats.endTime = Date.now();
        afterBatch();
      } else {
        // Next exercise
        renderTestExercise();
      }
      return;
    }
    
    // Regular mode progression
    if (state.stage === 'mcq') {
      // Progress through MCQ questions
      if (state.qIdx < state.qOrder.length - 1) {
        state.qIdx++;
        renderMCQ();
      } else {
        // MCQ phase complete
        if (state.exerciseMode === 'mcq-only') {
          // MCQ-only mode - finish after MCQ
          afterBatch();
        } else {
          // Full mode - move to typing phase
          state.qOrder = shuffle([...Array(state.batchItems.length).keys()]);
          state.qIdx = 0;
          renderTyping();
        }
      }
    } else if (state.stage === 'typing') {
      // Progress through typing questions
      if (state.qIdx < state.qOrder.length - 1) {
        state.qIdx++;
        renderTyping();
      } else {
        // Typing phase complete
        if (state.exerciseMode === 'typing-only') {
          // Typing-only mode - finish without practice prompt
          afterBatch();
        } else {
          // Full mode - check for mistakes and offer practice
          const mistakes = [...state.mistakes];
          if (mistakes.length) {
            renderPracticePrompt(mistakes);
          } else {
            // Perfect score - finish
            afterBatch();
          }
        }
      }
    } else if (state.stage === 'truefalse') {
      // Progress through True/False questions
      if (state.qIdx < state.qOrder.length - 1) {
        state.qIdx++;
        renderTrueFalse();
      } else {
        // True/False phase complete - finish
        afterBatch();
      }
    } else if (state.stage === 'sentenceorder') {
      // Progress through Sentence Ordering questions
      if (state.qIdx < state.qOrder.length - 1) {
        state.qIdx++;
        renderSentenceOrdering();
      } else {
        // Sentence Ordering complete - finish
        afterBatch();
      }
    } else if (state.stage === 'practice') {
      // Progress through practice questions
      if (state.qIdx < state.practiceIndices.length - 1) {
        state.qIdx++;
        renderTyping(true, state.practiceIndices);
      } else {
        // Practice complete - finish
        afterBatch();
      }
    } else if (state.stage === 'matching') {
      // Word matching phase complete - finish
      afterBatch();
    }
  }

  function renderMCQ(){
    if (!state.testMode.active) state.stage = 'mcq';
